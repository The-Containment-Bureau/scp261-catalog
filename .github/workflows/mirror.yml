# Rebuild this mirror from the live machine, once a day.
#
# CADENCE, and why it is not per-vend. A commit for every $1 dispense means a git write on a
# path we do not control the rate of, and the whole point of a launch is that the rate goes up.
# A daily batch has a bounded cost, and it costs nothing when nothing was sold: the generator
# writes no timestamps of its own, so a run with no new items produces no diff and the step
# below commits nothing. 05:40 UTC sits after the site repo's nightly test run (05:20) and
# before the 06:00 founder digest, so a broken mirror shows up in the same morning as
# everything else.
#
# Nothing here needs a secret. GITHUB_TOKEN can push to this repository, and the endpoint it
# reads is public.
name: mirror
on:
  schedule:
    - cron: "40 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  # Only for the keepalive step below.
  actions: write

concurrency:
  # Never let two mirror runs race each other onto main. Not cancel-in-progress: a half-done
  # mirror is worse than a late one.
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Fails the job if the site is down, if the collection comes back empty, or if any image
      # URL answers with something that is not an image. All three should stop the mirror
      # rather than commit a wrong record.
      - run: node tools/mirror-catalog.mjs --out .

      # PROOF OF EXISTENCE. index.json carries the SHA-256 of every image, so its hash pins the
      # whole collection. Each version of it is timestamped once with OpenTimestamps, anchored
      # in Bitcoin, at no cost: proofs/<sha256 of index.json>.ots. A fresh proof is "pending"
      # until a Bitcoin block confirms it (a few hours); later runs upgrade it to a complete,
      # self-contained proof. Just evidence that
      # this exact collection existed at that time.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Timestamp the collection
        run: |
          pip install --quiet opentimestamps-client==0.7.2
          mkdir -p proofs
          h=$(sha256sum index.json | cut -d' ' -f1)
          if [ ! -f "proofs/$h.ots" ]; then
            cp index.json "proofs/$h"
            ots stamp "proofs/$h"
            rm "proofs/$h"
          fi
          # Pending proofs become complete once Bitcoin has confirmed them. A proof that is
          # still pending makes `ots upgrade` exit non-zero, which is expected, not a failure.
          for p in proofs/*.ots; do ots upgrade "$p" || true; done
          # An upgrade keeps the old proof as <name>.bak; the upgraded one supersedes it.
          rm -f proofs/*.bak

      - name: Commit, but only if the collection actually changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "no change since the last run"
            exit 0
          fi
          count=$(node -e "process.stdout.write(String(require('./index.json').count))")
          git config user.name "scp261-mirror"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "mirror: ${count} items"
          git push

      # KEEPALIVE. GitHub disables scheduled workflows in a public repository after 60 days
      # without a commit, and a quiet machine means no commits: this mirror stopped on
      # 10.10.2026 that way and nobody noticed. Re-enabling the workflow through the API resets
      # that clock, so every daily run keeps the schedule alive.
      - name: Keep the schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/mirror.yml/enable"
